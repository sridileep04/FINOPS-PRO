apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: finops-secrets
  namespace: finops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: finops-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: finops/dev/app   # DB_*, SECRET_KEY, CREDENTIAL_ENCRYPTION_KEY, STEAMPIPE_SERVICE_TOKEN
    - extract:
        key: finops/dev/llm   # GROQ_API_KEY