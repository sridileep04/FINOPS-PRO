apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: finops
  source:
    repoURL: https://github.com/sridileep04/FINOPS-PRO.git
    targetRevision: main
    path: deploy/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true      # delete cluster objects whose manifest was removed from Git
      selfHeal: true   # undo manual `kubectl edit` drift