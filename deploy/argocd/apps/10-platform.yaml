apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: finops
  source:
    repoURL: https://github.com/sridileep04/FINOPS-PRO.git
    targetRevision: main
    path: deploy/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: finops
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }