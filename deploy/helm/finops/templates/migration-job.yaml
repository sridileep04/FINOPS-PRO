{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: finops-migrate
  labels:
    {{- include "finops.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "finops.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.backend.runAsUser }}
        seccompProfile:
          type: {{ .Values.securityContext.seccompProfile }}
      containers:
        - name: migrate
          image: {{ include "finops.image" (dict "root" . "image" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: {{ .Values.global.secretName }}
          securityContext:
            {{- include "finops.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
{{- end }}