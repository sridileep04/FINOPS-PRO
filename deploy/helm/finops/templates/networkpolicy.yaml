{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "finops.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-frontend
  labels:
    {{- include "finops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "finops.selector" (dict "root" . "component" "frontend") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.albSourceCidr }}
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  labels:
    {{- include "finops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "finops.selector" (dict "root" . "component" "backend") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "finops.selector" (dict "root" . "component" "frontend") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-steampipe
  labels:
    {{- include "finops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "finops.selector" (dict "root" . "component" "steampipe") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "finops.selector" (dict "root" . "component" "backend") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "finops.selector" (dict "root" . "component" "worker") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-redis
  labels:
    {{- include "finops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "finops.selector" (dict "root" . "component" "redis") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- range $c := list "backend" "worker" "beat" }}
        - podSelector:
            matchLabels:
              {{- include "finops.selector" (dict "root" $ "component" $c) | nindent 14 }}
        {{- end }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - protocol: TCP
          port: 6379
{{- end }}