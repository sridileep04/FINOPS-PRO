apiVersion: v1
kind: ConfigMap
metadata:
  name: finops-config
  labels:
    {{- include "finops.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  SEED_DEMO_USERS: {{ .Values.config.seedDemoUsers | quote }}
  ENCRYPTION_BACKEND: {{ .Values.config.encryptionBackend | quote }}
  PLATFORM_CREDENTIAL_SOURCE: {{ .Values.config.platformCredentialSource | quote }}
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis:6379/2"
  STEAMPIPE_SERVICE_URL: "http://steampipe-service:8001"
  {{- range $k, $v := .Values.config.extra }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}