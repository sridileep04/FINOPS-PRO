title = "FINOPS-PRO gitleaks config"

# Extend the default, well-maintained ruleset (AWS keys, generic API
# key patterns, private keys, etc.) rather than hand-rolling our own --
# gitleaks' default rules are actively updated for new provider key
# formats, which a custom-only ruleset would quickly fall behind on.
[extend]
useDefault = true

[allowlist]
description = "Known-safe placeholders that look like secrets but aren't"
paths = [
  # Test-only fixture values, generated fresh for this repo and used
  # only against ephemeral test containers -- see backend/.env.test.
  # (Also gitignored by `.env.*` in the root .gitignore, so this
  # allowlist entry is belt-and-suspenders in case that ever changes.)
  '''backend/\.env\.test''',
  # Generated test-coverage HTML reports mirror source file contents
  # verbatim, including the Docs.tsx example command below -- these are
  # build artifacts, not source, and are gitignored (see .gitignore
  # `coverage/`); excluded here too in case a report is ever committed
  # by mistake.
  '''frontend/coverage/''',
]
regexes = [
  # The sandbox demo password is intentionally public (see
  # backend/tests/security/AUDIT.md) -- not a leaked real credential.
  '''sandbox_secret_key''',
  # Docs.tsx shows this as a copy-pasteable example command on the
  # in-app documentation page ("case 'ghost_agent'") -- a fake
  # placeholder token for a code sample, not a real credential.
  '''af_live_948a37fbc28d3e8e7a02db6ef93d8e58''',
]

# Still deliberately NOT allowlisting `backend/.env.example` or
# `steampipe/.env.example` by path: a blanket path-allowlist for
# "*.env.example" would hide a genuinely leaked value committed to one
# of them (which is exactly what happened with
# steampipe/.env.example's 64-char hex token). Keep those paths scanned.
#
# --- Historical findings (working tree is now clean) ----------------
# The STEAMPIPE_SERVICE_TOKEN values in backend/test.md,
# steampipe/app/test.md and steampipe/.env.example, and the
# Fernet-shaped CREDENTIAL_ENCRYPTION_KEY literal in
# backend/tests/conftest.py, have all been replaced in the working tree
# (placeholders, and a per-session generated key respectively). They
# remain in git history, and gitleaks scans full history when this
# workflow is triggered manually or on the nightly schedule
# (fetch-depth: 0, ~38 commits) rather than just the pushed range --
# which is why these surfaced on a workflow_dispatch run after a series
# of green push runs, with no code change in between.
#
# History cannot be un-leaked without a filter-repo rewrite and a force
# push that breaks every existing clone, so those already-published
# occurrences are suppressed by *fingerprint*, in the `.gitleaksignore`
# file at the repo root -- NOT here. This allowlist table only supports
# commits/paths/regexes/stopwords; fingerprints are a .gitleaksignore
# feature. Fingerprint is deliberately the narrowest available form: it
# pins commit + file + rule + line, so it exempts only those exact
# historical findings. Re-introducing the same token in a new commit
# yields a different fingerprint and still fails the build, which a
# path or regex allowlist would not do.
#
# IMPORTANT: allowlisting suppresses the *alert*, not the exposure.
# These values were public in a GitHub repo, so treat them as
# compromised and rotate STEAMPIPE_SERVICE_TOKEN on any
# steampipe-service instance where either value was ever used. See
# backend/tests/security/AUDIT.md.