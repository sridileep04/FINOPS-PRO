[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    unit: fast, no network/DB, pure logic
    integration: hits a real Postgres/Redis via testcontainers
    slow: long-running (perf/heavy integration)
filterwarnings =
    # Turn off warnings from third-party packages you don't control
    ignore::DeprecationWarning:jose.*
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:pytest_asyncio.*
    ignore::DeprecationWarning:schemathesis.*
    ignore::DeprecationWarning:jsonschema.*
    # Keep your own code strict if desired:
    # error