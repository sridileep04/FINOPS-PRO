services:
  postgres:
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 5432
        published: "5432"
        protocol: tcp

  redis:
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 6379
        published: "6379"
        protocol: tcp

  backend:
    command: ['uvicorn-server']
    environment:
      ENVIRONMENT: development
      SEED_DEMO_USERS: 'true'
      CORS_ORIGINS: '*'
      API_WORKERS: '1'
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8000
        published: "8000"
        protocol: tcp
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro

  celery-worker:
    environment:
      ENVIRONMENT: development
    healthcheck:
      disable: true
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 9808
        published: "9808"
        protocol: tcp
    volumes:
      - ./backend/app:/app/app:ro

  celery-beat:
    environment:
      ENVIRONMENT: development
    healthcheck:
      disable: true
    volumes:
      - ./backend/app:/app/app:ro

  frontend:
    build:
      context: ./frontend
      target: builder
    command: ['npm', 'run', 'dev']
    ports:
      - mode: ingress
        target: 3000
        published: "80"
        protocol: tcp
      - mode: ingress
        target: 3000
        published: "3000"
        protocol: tcp
    volumes:
      - ./frontend/src:/build/src
      - ./frontend/public:/build/public
    environment:
      DISABLE_HMR: 'false'
      VITE_BACKEND_PROXY_TARGET: 'http://backend:8000'
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 9090
        published: "9090"
        protocol: tcp

  grafana:
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 3000
        published: "3001"
        protocol: tcp

  alertmanager:
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 9093
        published: "9093"
        protocol: tcp

  tempo:
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 3200
        published: "3200"
        protocol: tcp

  loki:
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 3100
        published: "3100"
        protocol: tcp

  promtail:
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 9080
        published: "9080"
        protocol: tcp