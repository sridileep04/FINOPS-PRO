server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers -----------------------------------------------
    # Defense-in-depth for a browser-facing static app; none of these
    # replace proper backend auth/authz, but they close off a class of
    # cheap client-side attacks (clickjacking, MIME-sniffing, referrer
    # leakage) for near-zero cost.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Deliberately no `unsafe-eval`; `unsafe-inline` for style-src only
    # (Tailwind/Vite emit some inline styles) -- tighten further with
    # nonces/hashes if a stricter CSP becomes a requirement later.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Only meaningful once served over HTTPS (see docker-compose.yml notes
    # on TLS termination) -- harmless as a no-op over plain HTTP otherwise.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Reverse-proxy API calls to the backend service (matches the same
    # `/api` prefix the Vite dev server proxies in vite.config.ts, so the
    # frontend code needs zero changes between dev and this prod image).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-poll/AI-copilot streaming responses shouldn't be buffered
        # into one chunk or cut off by an over-eager default timeout.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # Static assets: long cache lifetime is safe because Vite fingerprints
    # filenames with a content hash on every build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any route not matched above (React Router client-side
    # routes like /dashboard/settings) serves index.html and lets the
    # client-side router take over, instead of nginx 404ing on a direct
    # URL visit or page refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        deny all;
    }
}